proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vault_sync_connection_upgrade;
# Replace client-supplied forwarding headers. Configure the app to trust ONLY
# this proxy's actual peer address/CIDR, never all private networks by default.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_buffering off;
