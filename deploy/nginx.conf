# Include inside nginx's http context. Replace domain and certificate paths.
map $http_upgrade $vault_sync_connection_upgrade {
    default upgrade;
    '' close;
}
log_format vault_sync escape=json '{"remote":"$remote_addr","time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
limit_req_zone $binary_remote_addr zone=vault_sync_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=vault_sync_connections:10m;
server {
    listen 80;
    server_name obsidianvault.example.com;
    return 308 https://obsidianvault.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name obsidianvault.example.com;
    ssl_certificate /etc/letsencrypt/live/obsidianvault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsidianvault.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/vault-sync-access.log vault_sync;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 60s;
    limit_conn vault_sync_connections 32;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # Reject mismatched Host rather than serving this API as a catch-all.
    if ($host != obsidianvault.example.com) { return 444; }
    location = /user/signin {
        limit_req zone=vault_sync_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vault-sync-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/vault-sync-proxy.conf;
    }
}
