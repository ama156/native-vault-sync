name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run test:plugin
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: npm run release
